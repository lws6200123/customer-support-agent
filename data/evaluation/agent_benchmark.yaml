benchmark_id: stage8a-agent-benchmark
benchmark_version: 1.0.0
language: zh-CN
case_count: 60
simulation_clock: "2026-09-03T12:00:00"
description: >-
  A controlled portfolio benchmark for the DemoShop single-Agent workflow. Identifiers are
  anonymous Demo SQLite identifiers. It is not production traffic or an industry benchmark.

evaluation_fixtures:
  - fixture_id: refund-frequency-threshold
    description: Evaluation-only synthetic history; never written to the seed or Demo runtime DB.
    customer_id: CUST-001886
    order_id: ORD-000010
    approved_refunds:
      - {refund_id: EVAL-RFD-FREQ-01, amount: 1.0, requested_at: "2026-08-15T12:00:00"}
      - {refund_id: EVAL-RFD-FREQ-02, amount: 1.0, requested_at: "2026-08-25T12:00:00"}

tool_profiles:
  refund_full:
    required: &refund_full [lookup_customer, lookup_order, search_knowledge, evaluate_refund]
    forbidden: &refund_forbidden [list_customer_orders]
  policy_full:
    required: &policy_full [lookup_customer, lookup_order, search_knowledge]
    forbidden: &policy_full_forbidden [list_customer_orders, evaluate_refund]
  policy_customer_only:
    required: &policy_customer [lookup_customer, list_customer_orders, search_knowledge]
    forbidden: &policy_customer_forbidden [lookup_order, evaluate_refund]
  policy_no_context:
    required: &policy_no_context [search_knowledge]
    forbidden: &policy_no_context_forbidden [lookup_customer, lookup_order, list_customer_orders, evaluate_refund]
  account_context:
    required: &account_context [lookup_customer, search_knowledge]
    forbidden: &account_forbidden [lookup_order, list_customer_orders, evaluate_refund]
  other:
    required: &no_tools []
    forbidden: &all_tools [lookup_customer, lookup_order, list_customer_orders, search_knowledge, evaluate_refund]

