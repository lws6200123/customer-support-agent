    order_id: ORD-000009
    expected_intent: RETURN_REFUND
    expected_decision: AUTO_RESOLVE
    required_tools: *refund_full
    allowed_optional_tools: []
    forbidden_tools: *refund_forbidden
    expected_missing_fields: []
    expected_policy_topics: [return_exchange, refund_processing]
    risk_class: normal
    refund_input: {reason_code: NO_REASON, requested_amount: 20.0, product_condition_ok: true}
