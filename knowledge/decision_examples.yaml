    facts: {order_id: ORD-DEMO-012, policy_eligible: true, risk_flag: false, account_status: active, identity_verified: true, prior_approved_refunds_in_window: 0, source_data_quality_flag: none, suspected_fraud: false, policy_ambiguous: false, sensitive_action: true}
