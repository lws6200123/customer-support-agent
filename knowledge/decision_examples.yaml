examples_version: 1.0.0
purpose: Rule-consistency examples for tests; not an evaluation benchmark.
examples:
  - example_id: DEC-001
    intent: RETURN_REFUND
    sub_intent: request_refund
    action_type: refund_request
    facts: {order_id: ORD-DEMO-001, policy_eligible: true, amount: 299.0, risk_flag: false, account_status: active, identity_verified: true, prior_approved_refunds_in_window: 0, source_data_quality_flag: none, suspected_fraud: false, policy_ambiguous: false, sensitive_action: true}
    missing_fields: []
    expected_decision: AUTO_RESOLVE
    rationale: Complete low-risk request within the canonical auto-refund limit.
  - example_id: DEC-002
    intent: RETURN_REFUND
    sub_intent: request_refund
    action_type: refund_request
    facts: {order_id: ORD-DEMO-002, policy_eligible: true, amount: 899.0, risk_flag: false, account_status: active, identity_verified: true, prior_approved_refunds_in_window: 0, source_data_quality_flag: none, suspected_fraud: false, policy_ambiguous: false, sensitive_action: true}
    missing_fields: []
    expected_decision: ESCALATE_TO_HUMAN
    rationale: Amount exceeds the canonical auto-refund limit.
  - example_id: DEC-003
    intent: RETURN_REFUND
    sub_intent: request_refund
