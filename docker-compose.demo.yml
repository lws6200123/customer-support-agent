name: customer-support-agent-demo

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_PATH: /app/data/seed/customer_support_demo.db
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
      RAGFLOW_BASE_URL: ${CSA_DOCKER_RAGFLOW_BASE_URL:-http://host.docker.internal:9380}
    volumes:
      - type: bind
        source: ${CSA_DEMO_DATA_DIR:-./data/seed}
        target: /app/data/seed
    ports:
      - "${CSA_API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${CSA_DOCKER_FRONTEND_API_BASE_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CSA_FRONTEND_PORT:-8080}:80"
